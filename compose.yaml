name: xrpl-transaction-orchestrator

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator_local_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orchestrator -d orchestrator']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ['node', 'dist/database/migrate.js']
    environment:
      DATABASE_URL: postgresql://orchestrator:orchestrator_local_only@postgres:5432/orchestrator
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://orchestrator:orchestrator_local_only@postgres:5432/orchestrator
      XRPL_NETWORK_ID: ${XRPL_NETWORK_ID:-1}
      XRPL_PRIMARY_URL: ${XRPL_PRIMARY_URL:-wss://s.altnet.rippletest.net:51233/}
      XRPL_SECONDARY_URL: ${XRPL_SECONDARY_URL:-wss://testnet.xrpl-labs.com/}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      PORT: '3000'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
